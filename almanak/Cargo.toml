[package]
name = "almanak"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
description = "Almanak: Photo, Vector and Layout personas in one window"
publish = false

# Its own workspace: the vendored apps keep theirs (and their lints, profiles and lockfiles) and
# are reached here as path dependencies.
[workspace]

[dependencies]
photocraft-ui-egui = { path = "../photocraft/crates/ui-egui" }
photocraft-engine = { path = "../photocraft/crates/engine" }
photocraft-doc = { path = "../photocraft/crates/doc" }
photocraft-io = { path = "../photocraft/crates/io" }
photocraft-format = { path = "../photocraft/crates/format" }
vectorcraft-ui-egui = { path = "../vectorcraft/crates/ui-egui" }
vectorcraft-engine = { path = "../vectorcraft/crates/engine" }
designcraft-ui-egui = { path = "../designcraft/crates/ui-egui" }
designcraft-engine = { path = "../designcraft/crates/engine" }
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "wgpu", "accesskit", "wayland", "x11"] }
egui = "0.36"
rfd = "0.17"
serde_json = "1"
log = "0.4"

[profile.dev.package."*"]
opt-level = 2

[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.release]
lto = "thin"
codegen-units = 1
